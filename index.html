<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitly — Ton coach sportif</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      text-align: center;
      padding-top: 45px;
      padding-bottom: 35px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #9ca3af;
      margin-top: 10px;
      font-size: 15px;
    }

    .progress {
      height: 5px;
      background: #222;
      border-radius: 10px;
      margin-bottom: 35px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 16.66%;
      background: white;
      transition: width 0.3s;
    }

    .screen {
      display: none;
      animation: fade 0.25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 31px;
      line-height: 1.15;
      margin-bottom: 28px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      padding: 20px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 16px;
      color: white;
      text-align: left;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      background: #191919;
      border-color: #555;
      transform: translateY(-2px);
    }

    .option.selected {
      background: #fff;
      color: #000;
      border-color: white;
    }

    .next {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .next:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .result {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 20px;
      margin-top: 15px;
    }

    .day {
      margin-top: 15px;
      padding: 16px;
      background: #181818;
      border-radius: 14px;
    }

    .day h3 {
      margin-bottom: 10px;
    }

    .day p {
      color: #d1d5db;
      line-height: 1.8;
    }

    .restart {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">FITLY</div>
    <div class="subtitle">Ton entraînement. Ton objectif. Ton rythme.</div>
  </header>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <section class="screen active" data-step="1">
    <div class="step">1 / 6</div>
    <h1>Quel est ton objectif ?</h1>

    <div class="options">
      <button class="option" onclick="choose(this, 'objectif', 'muscle')">💪 Prendre du muscle</button>
      <button class="option" onclick="choose(this, 'objectif', 'perte')">🔥 Perdre du poids</button>
      <button class="option" onclick="choose(this, 'objectif', 'forme')">❤️ Me remettre en forme</button>
    </div>

    <button class="next" id="next1" disabled onclick="next()">Continuer →</button>
  </section>

  <section class="screen" data-step="2">
    <div class="step">2 / 6</div>
    <h1>Quel est ton niveau ?</h1>

    <div class="options">
      <button class="option" onclick="choose(this, 'niveau', 'debutant')">🌱 Débutant</button>
      <button class="option" onclick="choose(this, 'niveau', 'intermediaire')">⚡ Intermédiaire</button>
      <button class="option" onclick="choose(this, 'niveau', 'avance')">🔥 Avancé</button>
    </div>

    <button class="next" id="next2" disabled onclick="next()">Continuer →</button>
  </section>

  <section class="screen" data-step="3">
    <div class="step">3 / 6</div>
    <h1>Où vas-tu t'entraîner ?</h1>

    <div class="options">
      <button class="option" onclick="choose(this, 'lieu', 'maison')">🏠 À la maison</button>
      <button class="option" onclick="choose(this, 'lieu', 'salle')">🏋️ À la salle</button>
    </div>

    <button class="next" id="next3" disabled onclick="next()">Continuer →</button>
  </section>

  <section class="screen" data-step="4">
    <div class="step">4 / 6</div>
    <h1>Combien de séances par semaine ?</h1>

    <div class="options">
      <button class="option" onclick="choose(this, 'seances', 2)">2 séances</button>
      <button class="option" onclick="choose(this, 'seances', 3)">3 séances</button>
      <button class="option" onclick="choose(this, 'seances', 4)">4 séances</button>
      <button class="option" onclick="choose(this, 'seances', 5)">5 séances</button>
    </div>

    <button class="next" id="next4" disabled onclick="next()">Continuer →</button>
  </section>

  <section class="screen" data-step="5">
    <div class="step">5 / 6</div>
    <h1>Combien de temps par séance ?</h1>

    <div class="options">
      <button class="option" onclick="choose(this, 'duree', 20)">20 minutes</button>
      <button class="option" onclick="choose(this, 'duree', 30)">30 minutes</button>
      <button class="option" onclick="choose(this, 'duree', 45)">45 minutes</button>
      <button class="option" onclick="choose(this, 'duree', 60)">60 minutes</button>
    </div>

    <button class="next" id="next5" disabled onclick="next()">Continuer →</button>
  </section>

  <section class="screen" data-step="6">
    <div class="step">6 / 6</div>
    <h1>Quel matériel as-tu ?</h1>

    <div class="options">
      <button class="option" onclick="choose(this, 'materiel', 'aucun')">🤸 Aucun matériel</button>
      <button class="option" onclick="choose(this, 'materiel', 'maison')">🏠 Quelques équipements</button>
      <button class="option" onclick="choose(this, 'materiel', 'salle')">🏋️ Équipement complet</button>
    </div>

    <button class="next" id="next6" disabled onclick="generate()">Créer mon programme 🔥</button>
  </section>

  <section class="screen" id="resultScreen">

    <div class="step">TON PROGRAMME</div>

    <h1>Ton programme est prêt 💪</h1>

    <div id="result"></div>

    <button class="next restart" onclick="location.reload()">
      Recommencer
    </button>

  </section>

</div>

<script>

const answers = {};

let currentStep = 1;

function choose(button, key, value) {

  answers[key] = value;

  const options = button.parentElement.querySelectorAll(".option");

  options.forEach(option => {
    option.classList.remove("selected");
  });

  button.classList.add("selected");

  document.getElementById("next" + currentStep).disabled = false;
}

function next() {

  document.querySelector('[data-step="' + currentStep + '"]').classList.remove("active");

  currentStep++;

  document.querySelector('[data-step="' + currentStep + '"]').classList.add("active");

  document.getElementById("progressBar").style.width =
    ((currentStep / 6) * 100) + "%";
}

function generate() {

  document.querySelector('[data-step="6"]').classList.remove("active");
  document.getElementById("resultScreen").classList.add("active");
  document.getElementById("progressBar").style.width = "100%";

  let workouts = [];

  // PROGRAMMES MAISON
  if (answers.lieu === "maison") {

    if (answers.objectif === "muscle") {

      if (answers.niveau === "debutant") {
        workouts = [
          ["Haut du corps", [
            "Pompes — 3 × 6-10",
            "Pompes inclinées — 3 × 8-12",
            "Pike push-ups — 2 × 6-10",
            "Gainage — 3 × 20-30 sec"
          ]],
          ["Jambes", [
            "Squats — 3 × 10-15",
            "Fentes — 3 × 8/jambe",
            "Pont fessier — 3 × 12-15",
            "Mollets — 3 × 15-20"
          ]],
          ["Full body", [
            "Pompes — 3 × 6-10",
            "Squats — 3 × 12",
            "Fentes — 2 × 10/jambe",
            "Gainage — 3 × 30 sec"
          ]]
        ];
      } else {
        workouts = [
          ["Haut du corps", [
            "Pompes — 4 × 8-15",
            "Pike push-ups — 3 × 8-12",
            "Dips entre supports stables — 3 × 8-12",
            "Gainage — 3 × 40 sec"
          ]],
          ["Jambes", [
            "Squats — 4 × 12-20",
            "Fentes — 3 × 10/jambe",
            "Squats bulgares — 3 × 8/jambe",
            "Mollets — 4 × 15-20"
          ]],
          ["Full body", [
            "Pompes — 4 × 10-15",
            "Squats — 4 × 15",
            "Fentes — 3 × 10/jambe",
            "Pike push-ups — 3 × 8-12"
          ]]
        ];
      }

    } else if (answers.objectif === "perte") {

      workouts = [
        ["Cardio + jambes", [
          "Marche rapide — 10 min",
          "Squats — 3 × 15",
          "Fentes — 3 × 10/jambe",
          "Mountain climbers — 3 × 20"
        ]],
        ["Full body", [
          "Jumping jacks — 3 × 30 sec",
          "Squats — 3 × 15",
          "Pompes — 3 × 8-12",
          "Gainage — 3 × 30 sec"
        ]],
        ["Cardio", [
          "Marche rapide — 15 min",
          "Mountain climbers — 3 × 20",
          "Gainage — 3 × 30 sec"
        ]]
      ];

    } else {

      workouts = [
        ["Remise en forme", [
          "Marche — 10 min",
          "Squats — 3 × 10",
          "Pompes adaptées — 3 × 6-10",
          "Gainage — 3 × 20 sec"
        ]],
        ["Mobilité + corps", [
          "Marche — 10 min",
          "Fentes — 2 × 10/jambe",
          "Pont fessier — 3 × 12",
          "Gainage — 3 × 20 sec"
        ]]
      ];
    }

  // PROGRAMMES SALLE
  } else {

    if (answers.objectif === "muscle") {

      workouts = [
        ["Pectoraux + triceps", [
          "Développé couché — 3 × 8-12",
          "Développé incliné — 3 × 8-12",
          "Écartés — 3 × 12-15",
          "Extension triceps — 3 × 10-15"
        ]],
        ["Dos + biceps", [
          "Tirage vertical — 3 × 8-12",
          "Rowing — 3 × 8-12",
          "Tirage horizontal — 3 × 10-12",
          "Curl biceps — 3 × 10-15"
        ]],
        ["Jambes + épaules", [
          "Presse à cuisses — 3 × 10-15",
          "Leg curl — 3 × 10-15",
          "Élévations latérales — 3 × 12-15",
          "Mollets — 3 × 15-20"
        ]]
      ];

    } else if (answers.objectif === "perte") {

      workouts = [
        ["Cardio + jambes", [
          "Tapis ou vélo — 15 min",
          "Presse à cuisses — 3 × 12-15",
          "Fentes — 3 × 10/jambe",
          "Gainage — 3 × 30 sec"
        ]],
        ["Full body", [
          "Vélo — 10 min",
          "Développé — 3 × 10",
          "Tirage — 3 × 10",
          "Squats — 3 × 12"
        ]],
        ["Cardio", [
          "Tapis — 20 min",
          "Vélo — 10 min",
          "Gainage — 3 × 30 sec"
        ]]
      ];

    } else {

      workouts = [
        ["Full body", [
          "Échauffement — 5 min",
          "Presse à cuisses — 3 × 10",
          "Développé — 3 × 8-10",
          "Tirage — 3 × 10",
          "Gainage — 3 × 30 sec"
        ]],
        ["Haut du corps", [
          "Développé — 3 × 10",
          "Tirage vertical — 3 × 10",
          "Élévations latérales — 3 × 12",
          "Curl biceps — 2 × 12"
        ]]
      ];
    }
  }

  // ADAPTATION AU NOMBRE DE SÉANCES
  let selectedWorkouts = [];

  for (let i = 0; i < answers.seances; i++) {
    selectedWorkouts.push(workouts[i % workouts.length]);
  }

  // ADAPTATION DE LA DURÉE
  let durationText = "";

  if (answers.duree <= 20) {
    durationText = "Séance courte : privilégie les exercices principaux et garde des pauses courtes.";
  } else if (answers.duree <= 30) {
    durationText = "Séance de 30 min : concentre-toi sur les exercices principaux.";
  } else if (answers.duree <= 45) {
    durationText = "Séance complète : prends ton temps sur la technique et les pauses.";
  } else {
    durationText = "Séance longue : tu peux ajouter 1 à 2 exercices complémentaires.";
  }

  let html = `
    <div class="result">
      <p><strong>Objectif :</strong> ${answers.objectif === "muscle" ? "Prise de muscle" : answers.objectif === "perte" ? "Perte de poids" : "Remise en forme"}</p>
      <p><strong>Niveau :</strong> ${answers.niveau}</p>
      <p><strong>Durée :</strong> ${answers.duree} minutes</p>
      <p style="margin-top:10px;">${durationText}</p>
    </div>
  `;

  selectedWorkouts.forEach((workout, index) => {

    html += `
      <div class="day">
        <h3>Séance ${index + 1} — ${workout[0]}</h3>
        <p>${workout[1].join("<br>")}</p>
      </div>
    `;

  });

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
