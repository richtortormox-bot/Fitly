<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitly</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      padding: 25px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      color: #6b7280;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #f3f4f6;
      border-radius: 15px;
      line-height: 1.7;
    }

    .day {
      margin-top: 18px;
      padding: 15px;
      background: white;
      border-radius: 12px;
    }

    .day h4 {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>Fitly</h1>
  <p>Ton entraînement. Ton objectif. Ton rythme.</p>
</header>

<main>

  <div class="card">

    <h2>Créer mon programme 💪</h2>

    <label>Ton objectif</label>
    <select id="objectif">
      <option>Prendre du muscle</option>
      <option>Perdre du poids</option>
      <option>Me remettre en forme</option>
    </select>

    <label>Ton niveau</label>
    <select id="niveau">
      <option>Débutant</option>
      <option>Intermédiaire</option>
      <option>Avancé</option>
    </select>

    <label>Nombre de séances par semaine</label>
    <select id="seances">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <label>Durée d'une séance</label>
    <select id="duree">
      <option value="20">20 minutes</option>
      <option value="30">30 minutes</option>
      <option value="45">45 minutes</option>
      <option value="60">60 minutes</option>
    </select>

    <label>Matériel</label>
    <select id="materiel">
      <option>Sans matériel</option>
      <option>Quelques équipements</option>
      <option>Salle de sport</option>
    </select>

    <button onclick="creerProgramme()">
      Créer mon programme
    </button>

    <div id="result"></div>

  </div>

</main>

<script>

function creerProgramme() {

  const objectif = document.getElementById("objectif").value;
  const niveau = document.getElementById("niveau").value;
  const seances = Number(document.getElementById("seances").value);
  const duree = Number(document.getElementById("duree").value);
  const materiel = document.getElementById("materiel").value;

  let exercices = [];

  if (objectif === "Prendre du muscle") {

    if (materiel === "Sans matériel") {
      exercices = [
        "Pompes — 3 × 8-12",
        "Squats — 3 × 12-15",
        "Fentes — 3 × 10 par jambe",
        "Gainage — 3 × 30 secondes"
      ];
    } else {
      exercices = [
        "Pompes ou développé — 3 × 8-12",
        "Squats — 3 × 10-15",
        "Tirage ou tractions — 3 × 6-10",
        "Fentes — 3 × 10 par jambe",
        "Gainage — 3 × 30-45 secondes"
      ];
    }

  } else if (objectif === "Perdre du poids") {

    exercices = [
      "Marche rapide ou cardio — 10 minutes",
      "Squats — 3 × 15",
      "Fentes — 3 × 10 par jambe",
      "Mountain climbers — 3 × 20",
      "Gainage — 3 × 30 secondes"
    ];

  } else {

    exercices = [
      "Marche ou cardio léger — 10 minutes",
      "Squats — 3 × 10",
      "Pompes adaptées — 3 × 6-10",
      "Fentes — 2 × 10 par jambe",
      "Gainage — 3 × 20 secondes"
    ];
  }

  let programme = "";

  for (let i = 1; i <= seances; i++) {

    programme += `
      <div class="day">
        <h4>Séance ${i}</h4>
        <p>${exercices.join("<br>")}</p>
      </div>
    `;
  }

  document.getElementById("result").style.display = "block";

  document.getElementById("result").innerHTML = `
    <h3>Ton programme Fitly 🔥</h3>

    <p><strong>Objectif :</strong> ${objectif}</p>
    <p><strong>Niveau :</strong> ${niveau}</p>
    <p><strong>Durée :</strong> ${duree} minutes</p>
    <p><strong>Matériel :</strong> ${materiel}</p>

    ${programme}

    <p style="margin-top:20px;">
      💡 Pense à garder une bonne technique et à progresser progressivement.
    </p>
  `;
}

</script>

</body>
</html>
